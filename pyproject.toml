[project]
name = "bible-study"
version = "0.1.0"
description = "Index the KJV Bible and generate chapter-level summaries via local LLMs"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
     "click>=8.2",
     "PyYAML>=6.0",
     "requests>=2.32",
     "sqlite-vec>=0.1.6",
]

[project.scripts]
bible-study = "bible_study.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ─── Dev dependencies ────────────────────────────────────────────────────────

[project.optional-dependencies]
dev = [
     "pytest>=8.3",
     "pytest-cov>=5.0",
     "pytest-mock>=3.14",
     "mutmut>=3.1",
     "coverage[toml]>=7.6",
]

# ─── Pytest config ──────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --cov=bible_study --cov-config=pyproject.toml"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["bible_study"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass$",
    "# pragma: no cover",
]
fail_under = 90

[tool.coverage.html]
directory = "htmlcov"

# ─── Mutmut config ──────────────────────────────────────────────────────────

[tool.mutmut]
paths = ["src/bible_study"]
extensions = ".py"
filter = "."
