[project]
name = "bible-study"
version = "0.1.0"
description = "Index, summarize and semantically search the KJV Bible with local LLMs"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nathan Jones" }]
keywords = ["bible", "kjv", "llm", "ollama", "sqlite", "vector-search", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Religion",
    "Topic :: Text Processing :: Indexing",
    "Private :: Do Not Upload",
]

dependencies = [
     "click>=8.2",
     "PyYAML>=6.0",
     "requests>=2.32",
     "sqlite-vec>=0.1.6",
]

[project.scripts]
bible-study = "bible_study.cli:cli"

[project.urls]
Homepage = "https://github.com/snrugg/ai-bible-search"
Repository = "https://github.com/snrugg/ai-bible-search"
Issues = "https://github.com/snrugg/ai-bible-search/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ─── Dev dependencies ────────────────────────────────────────────────────────

[project.optional-dependencies]
dev = [
     "pytest>=8.3",
     "pytest-cov>=5.0",
     "pytest-mock>=3.14",
     "mutmut>=3.1",
     "coverage[toml]>=7.6",
]

# ─── Pytest config ──────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --cov=bible_study --cov-config=pyproject.toml"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["bible_study"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass$",
    "# pragma: no cover",
]
fail_under = 90

[tool.coverage.html]
directory = "htmlcov"

# ─── Mutmut config ──────────────────────────────────────────────────────────

[tool.mutmut]
paths = ["src/bible_study"]
extensions = ".py"
filter = "."
