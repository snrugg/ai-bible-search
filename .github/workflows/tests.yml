name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # requires-python is >=3.14; uv fetches it rather than using the
      # runner's preinstalled Python.
      - name: Install Python and dependencies
        run: uv sync --extra dev

      # sqlite-vec is a loadable extension, so the interpreter must have been
      # built with extension support and the manylinux wheel must actually
      # load.  Checking it here turns an obscure mass test failure into one
      # clear message.
      - name: Verify sqlite-vec loads
        run: |
          uv run python -c "
          import sqlite3, sqlite_vec
          conn = sqlite3.connect(':memory:')
          conn.enable_load_extension(True)
          sqlite_vec.load(conn)
          print('sqlite-vec', conn.execute('select vec_version()').fetchone()[0])
          "

      # addopts in pyproject already applies --cov with fail_under = 90, so
      # this enforces the coverage floor as well as the tests.  Every Ollama
      # and network call is mocked; no model or API access is needed.
      - name: Run tests
        run: uv run pytest

      - name: Check the package builds
        run: uv build
